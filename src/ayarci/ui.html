<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
:root{--a:var(--orca-accent,#009688);--fg:var(--orca-fg,#222);--bg:var(--orca-bg,#fafafa);--mut:var(--orca-muted,#777);
--line:var(--orca-border,rgba(127,127,127,.3));--soft:rgba(127,127,127,.10);--ok:#2e9d57;--warn:#c98a00;--bad:#d0453a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px/1.45 var(--orca-font,system-ui,"Segoe UI",sans-serif)}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;flex:1}
header .logo{color:var(--a);font-size:18px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;color:var(--fg);border:0;border-bottom:2px solid transparent;border-radius:0;padding:8px;cursor:pointer;font-weight:600}
.tabs button.on{border-bottom-color:var(--a);color:var(--a)}
main{flex:1;overflow:auto;padding:12px}
section[hidden]{display:none}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--mut);font-size:12px}
label.fld{display:block;margin:8px 0 3px;font-weight:600;font-size:12px}
select,input,textarea{width:100%;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
input:disabled,select:disabled,textarea:disabled{opacity:.55;background:var(--soft);cursor:not-allowed}
textarea{min-height:44px;resize:vertical}
button{font:inherit;cursor:pointer;border-radius:6px;padding:7px 12px;border:1px solid var(--a);background:var(--a);color:var(--orca-accent-fg,#fff)}
button.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
button.small{padding:3px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
.intents{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.intent{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:transparent;color:var(--fg);text-align:left}
.intent b{display:block;font-size:13px}
.intent span{font-size:11px;color:var(--mut)}
.intent.on{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chip{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--soft)}
.status{padding:8px 10px;border-radius:6px;background:var(--soft);margin:8px 0;white-space:pre-wrap}
.status.ok{border-left:3px solid var(--ok)}.status.warn{border-left:3px solid var(--warn)}.status.bad{border-left:3px solid var(--bad)}
.page{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.page>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--soft);cursor:pointer;font-weight:600}
.page>summary::-webkit-details-marker{display:none}
.page>summary .cnt{margin-left:auto;font-weight:400;color:var(--mut);font-size:12px}
.chg{display:grid;grid-template-columns:20px 1fr;gap:4px 6px;padding:7px 10px;border-top:1px solid var(--line)}
.chg input{width:auto;margin-top:2px}
.chg .name{font-weight:600}
.chg .vals{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.chg .vals .old{color:var(--mut);text-decoration:line-through}
.chg .vals .new{color:var(--a);font-weight:700}
.chg .why{grid-column:2;color:var(--mut);font-size:12px}
.chg .src{font-size:10px;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:4px;color:var(--mut)}
footer{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
footer .grow{flex:1}
.checklist{margin:0;padding:0;list-style:none}
.checklist li{display:flex;gap:8px;align-items:center;padding:3px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px}
.kv span:nth-child(odd){color:var(--mut)}
.inline{display:flex;gap:6px}
.inline input{flex:1}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--a);border-radius:50%;animation:s 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
code.sel{user-select:all;background:var(--soft);padding:1px 5px;border-radius:4px;word-break:break-all}
</style></head>
<body>
<header><span class="logo">◆</span><h1>3DsetuPia</h1>
<span class="badge" id="modeBadge"><span class="dot" id="modeDot"></span><span id="modeText">…</span></span>
<select id="lang" style="width:auto;padding:2px 4px"><option value="tr">TR</option><option value="en">EN</option></select>
</header>
<div class="tabs"><button id="tabA" class="on" data-i="tab_assist"></button><button id="tabS" data-i="tab_settings"></button></div>

<main>
<section id="assist">
  <div class="card"><h3 data-i="plate"></h3><div id="scene" class="muted"></div></div>

  <div class="card">
    <label class="fld" for="filament" data-i="filament"></label>
    <select id="filament"></select>
    <div class="muted" id="filHint"></div>
    <label class="fld" data-i="goal"></label>
    <div class="intents" id="intents"></div>
    <label class="fld" for="note" data-i="note"></label>
    <textarea id="note" maxlength="500"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="go" style="flex:1" data-i="prepare"></button>
      <button id="refresh" class="ghost" data-i="refresh"></button>
    </div>
  </div>

  <div id="progress" class="status" hidden></div>
  <div id="result" hidden>
    <div class="card"><h3 data-i="what_i_saw"></h3><div id="summary"></div><div class="chips" id="chips"></div></div>
    <div id="warnings"></div>
    <div class="row" style="margin:6px 0">
      <span class="muted grow" id="countText" style="flex:1"></span>
      <button class="ghost small" id="all" data-i="select_all"></button>
      <button class="ghost small" id="none" data-i="select_none"></button>
    </div>
    <div id="pages"></div>
  </div>
</section>

<section id="settings" hidden>
  <div class="card">
    <h3 data-i="readiness"></h3>
    <ul class="checklist" id="checklist"></ul>
  </div>
  <div class="card">
    <label class="fld" for="provider" data-i="provider"></label>
    <select id="provider"></select>
    <div class="muted" id="provHelp" style="margin-top:4px"></div>
    <div class="muted" id="keyPage" style="margin-top:4px"></div>

    <label class="fld" for="url" id="urlLabel" data-i="address"></label>
    <input id="url" spellcheck="false" autocomplete="off">

    <label class="fld" for="key" id="keyLabel" data-i="api_key"></label>
    <div class="inline"><input id="key" type="password" spellcheck="false" autocomplete="off">
      <button class="ghost small" id="eye" type="button">👁</button></div>
    <div class="row" style="margin-top:3px"><span class="muted" id="keyState" style="flex:1"></span>
      <button class="ghost small" id="clearKey" data-i="clear_key"></button></div>

    <label class="fld" for="model" data-i="model"></label>
    <input id="model" list="models" spellcheck="false" autocomplete="off">
    <datalist id="models"></datalist>
    <div class="muted" id="modelHint"></div>

    <div class="row" style="margin-top:10px">
      <button id="save" data-i="save"></button>
      <button id="test" class="ghost" data-i="test"></button>
    </div>
    <div id="setStatus" class="status" hidden></div>
  </div>
  <div class="card"><h3 data-i="privacy"></h3><div class="muted" data-i="privacy_text"></div></div>
  <div class="card"><h3 data-i="about"></h3><div class="kv" id="about"></div></div>
</section>
</main>

<footer id="applyBar" hidden>
  <span class="grow muted" id="selText"></span>
  <button class="ghost" id="undo" hidden data-i="undo"></button>
  <button id="apply" data-i="apply"></button>
</footer>

var S={lang:"tr",intent:"balanced",providers:[],settings:{provider:"none",providers:{}},caps:{can_write:true},
changes:[],sel:{},busy:false,applied:false,models:[],pages:{},order:[],filamentSlot1:"",showKey:false};
function $(id){return document.getElementById(id)}
function t(k,v){var s=(T[S.lang]&&T[S.lang][k])||T.en[k]||k;if(v)for(var x in v)s=s.split("{"+x+"}").join(v[x]);return s}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function send(cmd,extra){var m={command:cmd};if(extra)for(var k in extra)m[k]=extra[k];orca.postMessage(m)}
function prov(){var id=$("provider").value||S.settings.provider||"none";for(var i=0;i<S.providers.length;i++)if(S.providers[i].id===id)return S.providers[i];return S.providers[0]||{id:"none"}}
function per(id){return (S.settings.providers||{})[id]||{}}

function paintStatic(){
  document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=t(el.getAttribute("data-i"))});
  $("note").placeholder=t("note_ph");$("lang").value=S.lang;document.documentElement.lang=S.lang;
  var ints=["balanced","looks","strength","speed"];
  $("intents").innerHTML=ints.map(function(i){return '<button type="button" class="intent'+(S.intent===i?" on":"")+'" data-v="'+i+'"><b>'+esc(t("i_"+i))+'</b><span>'+esc(t("d_"+i))+'</span></button>'}).join("");
}
function readiness(){
  var p=prov(),pp=per(p.id),c={provider:p.id!=="none"};
  if(p.id==="none")return {ready:false,rules:true,items:[]};
  var keyOk=!p.needs_key||pp.has_key, urlOk=!p.url_editable||!!($("url").value||p.base_url), modelOk=!!(pp.model||p.default_model);
  var items=[[true,t("ck_provider")+": "+p.label],[keyOk,p.needs_key?t("ck_key"):t("ck_key_na")]];
  if(p.url_editable)items.push([urlOk,t("ck_url")]);
  items.push([!!pp.tested,t("ck_test")],[modelOk,t("ck_model")+(modelOk?": "+(pp.model||p.default_model):"")]);
  var ready=items.every(function(i){return i[0]});
  return {ready:ready,rules:false,items:items};
}
function paintMode(){
  var r=readiness(),p=prov(),pid=S.settings.provider||"none";
  var active=null;for(var i=0;i<S.providers.length;i++)if(S.providers[i].id===pid)active=S.providers[i];
  var dot=$("modeDot");
  if(pid==="none"){$("modeText").textContent=t("mode_rules");dot.className="dot ok"}
  else{var pp=per(pid);var ok=(!active.needs_key||pp.has_key)&&pp.tested&&(pp.model||active.default_model);
    $("modeText").textContent=ok?t("mode_ai",{p:active.label+(pp.model||active.default_model?" · "+(pp.model||active.default_model):"")}):t("mode_incomplete");
    dot.className="dot "+(ok?"ok":"warn")}
  var ul=$("checklist");
  if(r.rules){ul.innerHTML='<li><span class="dot ok"></span>'+esc(t("ck_rules"))+'</li>';return}
  ul.innerHTML=r.items.map(function(i){return '<li><span class="dot '+(i[0]?"ok":"bad")+'"></span>'+esc(i[1])+'</li>'}).join("")+
   '<li style="margin-top:4px"><b>'+esc(r.ready?t("ck_ready"):t("ck_missing"))+'</b></li>';
}

  $("keyPage").innerHTML=p.key_page?esc(t("key_page"))+' <code class="sel">'+esc(p.key_page)+'</code>':"";
  var urlOn=!!p.url_editable;$("url").disabled=!urlOn||p.id==="none";
  $("url").value=urlOn?(pp.base_url||p.base_url||""):(p.base_url||"");
  $("url").title=urlOn?t("url_edit"):t("url_fixed");

  $("key").value="";$("key").placeholder=keyOn?(pp.has_key?t("key_replace"):t("key_ph")):t("key_na");
  $("keyState").textContent=keyOn?(pp.has_key?t("key_saved",{h:pp.key_hint||"…"}):t("key_none")):t("key_na");

function chipsFor(a){
  var s=(a&&a.summary)||{},c=[],tags=s.tags||[];
  if(s.max_height_mm!=null)c.push(t("c_height",{v:s.max_height_mm}));
  if(s.min_bed_contact_mm2!=null)c.push(t("c_contact",{v:Math.round(s.min_bed_contact_mm2)}));
  if(s.total_overhang_below_30deg_mm2)c.push(t("c_overhang",{v:Math.round(s.total_overhang_below_30deg_mm2)}));
  if(s.min_wall_thickness_p10_mm!=null)c.push(t("c_thin",{v:s.min_wall_thickness_p10_mm}));
  if(tags.indexOf("organic")>=0)c.push(t("c_shape_org"));if(tags.indexOf("mechanical")>=0)c.push(t("c_shape_mech"));
  if(tags.indexOf("tall_thin")>=0)c.push(t("c_tall"));if(tags.indexOf("tipping_risk")>=0)c.push(t("c_tip"));
  if(tags.indexOf("flat_top")>=0)c.push(t("c_flat"));if(tags.indexOf("needs_support")>=0)c.push(t("c_support"));
  if(tags.indexOf("self_supporting")>=0)c.push(t("c_self"));
  return c.map(function(x){return '<span class="chip">'+esc(x)+'</span>'}).join("");
}
function paintScene(m){
  var o=m.objects||[];
  var html=o.length?('<b>'+esc(t("objects",{n:o.length}))+'</b>: '+o.slice(0,6).map(function(x){return esc(x.name)+(x.size_mm?' <span class="muted">('+x.size_mm.join("×")+' mm)</span>':"")}).join(", ")+(o.length>6?"…":"")):esc(t("no_objects"));
  html+='<div class="kv" style="margin-top:6px"><span>'+esc(t("printer"))+'</span><span>'+esc(m.printer_name||"—")+'</span><span>'+esc(t("nozzle"))+'</span><span>'+esc(m.nozzle||"—")+' mm</span><span>'+esc(t("process"))+'</span><span>'+esc(m.process_name||"—")+'</span><span>'+esc(t("bed"))+'</span><span>'+esc(m.bed_type||"—")+'</span></div>';
  if(m.scene_error||m.preset_error)html+='<div class="status bad">'+esc(m.scene_error||m.preset_error)+'</div>';
  $("scene").innerHTML=html;
  if(m.filament_choices){
    S.filamentSlot1=m.filament_slot1||"";var cur=$("filament").value||m.filament_selected||m.filament_slot1;
    var names=m.filament_choices.map(function(c){return c.name});if(cur&&names.indexOf(cur)<0)names.unshift(cur);
    $("filament").innerHTML=names.map(function(n){return '<option'+(n===cur?" selected":"")+'>'+esc(n)+'</option>'}).join("");
    var hint=[];if(m.filament_slots>1)hint.push(t("fil_multi",{n:m.filament_slots}));
    $("filHint").textContent=hint.join(" ");filHint();
  }
}
function filHint(){var h=$("filHint").textContent.split(" · ")[0];if($("filament").value&&$("filament").value!==S.filamentSlot1){$("filHint").textContent=(h&&h!==t("fil_switch")?h+" · ":"")+t("fil_switch")}}
function progress(text,kind){var p=$("progress");if(!text){p.hidden=true;return}p.hidden=false;p.className="status "+(kind||"");p.innerHTML=(kind?"":'<span class="spin"></span>')+esc(text)}
function busy(b){S.busy=b;$("go").disabled=b;$("apply").disabled=b||!countSel();$("undo").disabled=b}
function countSel(){var n=0;for(var k in S.sel)if(S.sel[k])n++;return n}
function paintChanges(m){
  $("result").hidden=false;
  $("summary").innerHTML='<div>'+esc(m.summary||"")+'</div><div class="muted" style="margin-top:4px">'+esc(m.source==="ai"?t("src_ai"):t("src_rules"))+(m.seconds!=null?" · "+esc(t("c_time",{s:m.seconds})):"")+'</div>';
  $("chips").innerHTML=chipsFor(m.analysis);
  $("warnings").innerHTML=(m.warnings||[]).map(function(w){return '<div class="status warn">'+esc(w)+'</div>'}).join("")+(S.caps.can_write?"":'<div class="status warn">'+esc(t("readonly"))+'</div>');
  S.changes=m.changes||[];S.sel={};S.changes.forEach(function(c){S.sel[c.id]=true});
  if(m.filament_switch)S.sel["fil"]=true;
  var by={};S.changes.forEach(function(c){(by[c.page]=by[c.page]||[]).push(c)});
  var html="";
  if(!S.changes.length&&!m.filament_switch)html='<div class="status ok">'+esc(t("nothing_needed"))+'</div>';
  if(m.filament_switch)html+='<details class="page" open><summary>'+esc(t("filament"))+'</summary><label class="chg"><input type="checkbox" data-id="fil" checked><div><span class="name">'+esc(t("fil_profile"))+'</span><div class="vals"><span class="old">'+esc(m.filament_from||"—")+'</span> → <span class="new">'+esc(m.filament_to||"")+'</span></div></div><div class="why">'+esc(t("fil_switch"))+'</div></label></details>';
  (S.order||[]).forEach(function(pg){var list=by[pg];if(!list)return;
    html+='<details class="page" open><summary>'+esc(S.pages[pg]||pg)+'<span class="cnt">'+esc(t("changes",{n:list.length}))+'</span></summary>'+
    list.map(function(c){return '<label class="chg"><input type="checkbox" data-id="'+c.id+'" checked><div><span class="name">'+esc(c.label)+'</span><span class="src">'+esc(c.source==="ai"?t("from_ai"):t("from_rules"))+'</span><div class="vals"><span class="old">'+esc(c.old_display)+'</span> → <span class="new">'+esc(c.new_display)+'</span></div></div><div class="why">'+esc(c.reason||"")+'</div></label>'}).join("")+'</details>'});
  $("pages").innerHTML=html;$("countText").textContent=t("changes",{n:S.changes.length});
  $("applyBar").hidden=!(S.changes.length||m.filament_switch);S.applied=false;$("undo").hidden=true;updSel();
}
function updSel(){$("selText").textContent=t("selected",{n:countSel()});$("apply").disabled=S.busy||!countSel()||!S.caps.can_write}
function tab(which){$("assist").hidden=which!=="a";$("settings").hidden=which!=="s";$("tabA").className=which==="a"?"on":"";$("tabS").className=which==="s"?"on":"";
  $("applyBar").style.display=which==="a"?"":"none"}

$("tabA").onclick=function(){tab("a")};$("tabS").onclick=function(){tab("s")};
$("lang").onchange=function(){S.lang=$("lang").value;paintStatic();paintProvider();send("set_lang",{lang:S.lang})};
$("intents").onclick=function(e){var b=e.target.closest(".intent");if(!b)return;S.intent=b.getAttribute("data-v");paintStatic()};
$("filament").onchange=function(){$("filHint").textContent="";filHint()};
$("refresh").onclick=function(){send("refresh",{filament:$("filament").value})};
$("go").onclick=function(){busy(true);$("result").hidden=true;$("applyBar").hidden=true;progress(t("working"));
  send("analyze",{intent:S.intent,note:$("note").value,filament:$("filament").value,use_ai:true})};
$("pages").onchange=function(e){var id=e.target.getAttribute("data-id");if(id!=null){S.sel[id]=e.target.checked;updSel()}};
$("all").onclick=function(){document.querySelectorAll("#pages input[type=checkbox]").forEach(function(x){x.checked=true;S.sel[x.getAttribute("data-id")]=true});updSel()};
$("none").onclick=function(){document.querySelectorAll("#pages input[type=checkbox]").forEach(function(x){x.checked=false;S.sel[x.getAttribute("data-id")]=false});updSel()};
$("apply").onclick=function(){var ids=[];for(var k in S.sel)if(S.sel[k]&&k!=="fil")ids.push(Number(k));busy(true);progress(t("working"));
  send("apply",{ids:ids,switch_filament:!!S.sel["fil"]})};
$("undo").onclick=function(){busy(true);progress(t("working"));send("undo")};
$("provider").onchange=function(){S.models=[];paintProvider()};
$("eye").onclick=function(){S.showKey=!S.showKey;$("key").type=S.showKey?"text":"password"};
function settingsMsg(extra){var p=prov();var m={provider:p.id,model:$("model").value,base_url:p.url_editable?$("url").value:""};
  var k=$("key").value;if(k)m.api_key=k;if(extra)for(var x in extra)m[x]=extra[x];return m}
$("save").onclick=function(){send("save_settings",settingsMsg())};
$("clearKey").onclick=function(){send("save_settings",settingsMsg({clear_key:true}))};
$("test").onclick=function(){send("save_settings",settingsMsg());var s=$("setStatus");s.hidden=false;s.className="status";s.innerHTML='<span class="spin"></span>'+esc(t("testing"));send("test")};

function onHost(m){if(!m||!m.command)return;
  if(m.command==="init"){S.lang=m.lang||"tr";S.providers=m.providers||[];S.settings=m.settings||S.settings;S.caps=m.caps||S.caps;S.pages=m.pages||{};S.order=m.page_order||[];
    $("provider").innerHTML=S.providers.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.label)+'</option>'}).join("");
    $("provider").value=S.settings.provider||"none";paintStatic();paintProvider();paintScene(m);
    $("about").innerHTML='<span>3DsetuPia</span><span>'+esc(m.version)+'</span><span>OrcaSlicer</span><span>'+esc(m.orca_version||"—")+'</span><span>Log</span><span><code class="sel">'+esc(m.storage||"")+'</code></span><span>GitHub</span><span><code class="sel">'+esc(m.repo||"")+'</code></span>'}
  else if(m.command==="scene"){paintScene(m)}
  else if(m.command==="progress"){progress(m.text)}
  else if(m.command==="proposals"){busy(false);if(!m.ok){progress(m.text,"bad");return}progress("");paintChanges(m)}
  else if(m.command==="applied"){busy(false);progress(m.text+(m.ok?"\n"+t("save_hint"):""),m.ok?"ok":"bad");if(m.ok){S.applied=true;$("undo").hidden=false}send("refresh",{filament:$("filament").value})}
  else if(m.command==="undone"){busy(false);progress(m.text,m.ok?"ok":"bad");if(m.ok)$("undo").hidden=true;send("refresh",{filament:$("filament").value})}
  else if(m.command==="settings_saved"){S.settings=m.settings||S.settings;paintProvider();var s=$("setStatus");if(s.innerHTML.indexOf("spin")<0){s.hidden=false;s.className="status ok";s.textContent=t("saved")}}
  else if(m.command==="test_result"){if(m.settings)S.settings=m.settings;S.models=m.models||[];paintProvider();var s=$("setStatus");s.hidden=false;s.className="status "+(m.ok?"ok":"bad");s.textContent=m.text}
  else if(m.command==="error"){busy(false);progress(t("error")+": "+m.text,"bad")}
}
// OrcaSlicer injects window.orca before page scripts run; wait briefly in case a host is slower.
paintStatic();
(function boot(n){if(window.orca&&window.orca.onMessage){orca.onMessage(onHost);send("init");
    // the first message can race the panel handle on the plugin side; ask again until answered
    (function again(k){setTimeout(function(){if(!S.providers.length&&k<8){send("init");again(k+1)}},800)})(0);return}
  if(n<100)setTimeout(function(){boot(n+1)},50);else progress("OrcaSlicer bridge not found","bad")})(0);
})();
</script>
</body></html>
